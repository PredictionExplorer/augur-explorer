<title>Mint Report</title>
<div class="page-header">
	<h1>Mint Report</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Year</th>
			<th>Month</th>
			<th class="center">Tokens Minted</th>
			<th class="right">Total (ETH)</th>
			<th class="right">Redeem Amount (ETH)</th>
		</tr>
		{{- range $i, $change := .Records}}
			<tr>
				<td class="center">{{num .Year}}</td>
				<td>{{.MonthStr}}</td>
				<td class="center">{{num .TotalMinted}}</td>
				<td class="right">{{printf "%.6f" .TotalEth}}</td>
				<td class="right">{{printf "%.6f" .RedeemAmount}}</td>
			</tr>
		{{- end}}
	</table>
</div>
