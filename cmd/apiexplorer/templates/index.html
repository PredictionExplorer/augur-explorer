<html>
<head>
	<title>API Explorer</title>
	<link href="/res/main.css" rel="stylesheet">
	<link href="/res/cosmicgame.css" rel="stylesheet">
</head>
<body>
	<div class="cg-container">
		<div class="page-header">
			<h1>🔭 API Explorer</h1>
			<div class="subtitle">Data viewer over the RWCG API server</div>
		</div>

		<div style="display: flex; justify-content: center; gap: 3em; margin-top: 4em; flex-wrap: wrap;">
			<a href="/randomwalk/" style="text-decoration: none;">
				<div style="width: 12em; height: 8em; border: 0.3em solid goldenrod; border-radius: 0.8em;
						color: goldenrod; font-family: sans-serif; font-weight: bold; font-size: 1.6em;
						letter-spacing: 0.08em; text-transform: uppercase; display: flex; flex-direction: column;
						align-items: center; justify-content: center; gap: 0.4em; transition: 0.3s;"
					onmouseover="this.style.background='goldenrod'; this.style.color='black';"
					onmouseout="this.style.background='transparent'; this.style.color='goldenrod';">
					<img src="/res/randomwalk-logo.png" alt="RandomWalk logo" style="width: 3.2em; height: 3.2em; object-fit: contain;">
					RandomWalk
				</div>
			</a>
			<a href="/cosmicsignature/" style="text-decoration: none;">
				<div style="width: 12em; height: 8em; border: 0.3em solid goldenrod; border-radius: 0.8em;
						color: goldenrod; font-family: sans-serif; font-weight: bold; font-size: 1.6em;
						letter-spacing: 0.08em; text-transform: uppercase; display: flex; flex-direction: column;
						align-items: center; justify-content: center; gap: 0.4em; transition: 0.3s;"
					onmouseover="this.style.background='goldenrod'; this.style.color='black';"
					onmouseout="this.style.background='transparent'; this.style.color='goldenrod';">
					<img src="/res/cosmicsignature-logo.svg" alt="CosmicSignature logo" style="width: 3.2em; height: 3.2em; object-fit: contain;">
					CosmicSignature
				</div>
			</a>
		</div>
	</div>
</body>
</html>
