<title>CST Staking Rewards Detail by Token</title>
<div class="page-header">
	<h1>CST Staking Reward Details</h1>
	<div class="subtitle">Token #{{.TokenId}} for User {{.UserAddr}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Deposit ID</th>
			<th class="right">Reward (ETH)</th>
			<th class="center">Round</th>
			<th>DateTime</th>
			<th class="center">Collected</th>
		</tr>
		{{- range $i, $change := .RewardsByTokenDetails}}
			<tr>
				<td class="center">{{.DepositId}}</td>
				<td class="right">{{printf "%.6f" .RewardEth}}</td>
				<td class="center">{{.RoundNum}}</td>
				<td>{{.DepositDateTime}}</td>
				<td class="center">
					{{if .Claimed}}<span class="badge badge-success">Yes</span>{{else}}<span class="badge badge-default">No</span>{{end}}
				</td>
			</tr>
		{{- end}}
	</table>
</div>
