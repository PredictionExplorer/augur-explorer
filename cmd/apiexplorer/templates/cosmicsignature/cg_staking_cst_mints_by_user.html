<title>CST Staking Raffle Wins by User</title>
<div class="page-header">
	<h1>CST Staking Raffle Wins</h1>
	<div class="address-display">{{.UserAddr}}</div>
	<div class="subtitle" style="margin-top: 1em;">Tokens won in raffles for staking CST</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Winner</th>
			<th class="center">Round</th>
			<th class="center">Token ID</th>
		</tr>
		{{- range $i, $change := .CSTStakingRewardMints}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .WinnerAddr}}
				</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="center">
					<a href="/cosmicsignature/cst/info/{{.TokenId}}">{{.TokenId}}</a>
				</td>
			</tr>
		{{- end}}
	</table>
</div>
