<html>
<head>
	<link href="/res/main.css" rel="stylesheet">
	<link href="/res/cosmicgame.css" rel="stylesheet">
	<title>CS Token Distribution</title>
</head>
<body>
	<div class="cg-container">
		<div class="page-header">
			<a class="home-link" href="/cosmicsignature">&larr; Home</a>
			<h1>Cosmic Signature Token Distribution</h1>
		</div>

		<div class="section-card">
			<table class="data-table">
				<tr>
					<th>Owner Address</th>
					<th class="right">Tokens Owned</th>
				</tr>
				{{- range $i, $change := .CosmicSignatureTokenDistribution}}
					<tr>
						<td class="monospace">
							{{ethAddrLink .OwnerAddr}}
						</td>
						<td class="right">{{.NumTokens}}</td>
					</tr>
				{{- end}}
			</table>
		</div>

		<div class="api-info">
			<strong>API Endpoint:</strong><br/>
			<code>/api/cosmicgame/cst/distribution</code><br/><br/>
			<strong>Example:</strong><br/>
			<code>/api/cosmicgame/cst/distribution</code>
		</div>
	</div>
</body>
</html>
