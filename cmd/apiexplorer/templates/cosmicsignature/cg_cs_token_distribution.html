<title>CS Token Distribution</title>
<div class="page-header">
	<h1>Cosmic Signature Token Distribution</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Owner Address</th>
			<th class="right">Tokens Owned</th>
		</tr>
		{{- range $i, $change := .CosmicSignatureTokenDistribution}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .OwnerAddr}}
				</td>
				<td class="right">{{.NumTokens}}</td>
			</tr>
		{{- end}}
	</table>
</div>
