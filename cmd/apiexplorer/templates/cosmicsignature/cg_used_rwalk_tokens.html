<title>Used RandomWalk NFTs</title>
<div class="page-header">
	<h1>Used RandomWalk NFT Tokens</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th>DateTime</th>
			<th class="center">Round</th>
			<th class="center">Token ID</th>
		</tr>
		{{- range $i, $change := .UsedRwalkNFTs}}
			<tr>
				<td class="center">{{arbiscanTx .TxHash .BlockNum}}</td>
				<td>{{.DateTime}}</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="center">{{.RWalkTokenId}}</td>
			</tr>
		{{- end}}
	</table>
</div>
