<title>User ERC20 Transfers</title>
<div class="page-header">
	<h1>CosmicToken (ERC20) Transfers</h1>
	<div class="address-display">{{.UserAddr}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>From</th>
			<th>To</th>
			<th class="right">Value</th>
			<th class="right">Value (Float)</th>
		</tr>
		{{- range $i, $change := .CosmicTokenTransfers}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .FromAddr}}
				</td>
				<td class="monospace">
					{{ethAddrLink .ToAddr}}
				</td>
				<td class="right monospace">{{.Value}}</td>
				<td class="right">{{printf "%.2f" .ValueFloat}}</td>
			</tr>
		{{- end}}
	</table>
</div>
