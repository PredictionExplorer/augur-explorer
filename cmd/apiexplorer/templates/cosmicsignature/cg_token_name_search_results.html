<title>Token Name Search Results</title>
<div class="page-header">
	<h1>Token Name Search Results</h1>
	<div class="subtitle">Search text: "{{.SearchText}}"</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>DateTime Minted</th>
			<th class="center">Token ID</th>
			<th>Token Name</th>
		</tr>
		{{- range $i, $change := .TokenNameSearchResults}}
			<tr>
				<td>{{.MintDateTime}}</td>
				<td class="center">{{.TokenId}}</td>
				<td>
					<a href="/cosmicsignature/cst/info/{{.TokenId}}">{{.TokenName}}</a>
				</td>
			</tr>
		{{- end}}
	</table>
</div>
