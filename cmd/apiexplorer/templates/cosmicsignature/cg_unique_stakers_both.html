<title>Unique Stakers (Both Types)</title>
<div class="page-header">
	<h1>Unique Stakers (CST & RandomWalk)</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Staker Address</th>
			<th class="center">CST Tokens Staked</th>
			<th class="center">RWalk Tokens Staked</th>
			<th class="center">RWalk Reward Mints</th>
		</tr>
		{{- range $i, $change := .UniqueStakersBoth}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .StakerAddr}}
				</td>
				<td class="center">
					<a href="/cosmicsignature/staking/cst/staked_tokens/by_user/{{.StakerAddr}}">{{.CSTStats.TotalTokensStaked}}</a>
				</td>
				<td class="center">
					<a href="/cosmicsignature/staking/randomwalk/staked_tokens/by_user/{{.StakerAddr}}">{{.RWalkStats.TotalTokensStaked}}</a>
				</td>
				<td class="center">
					<a href="/cosmicsignature/staking/randomwalk/mints/by_user/{{.StakerAddr}}">{{.RWalkStats.TotalTokensMinted}}</a>
				</td>
			</tr>
		{{- end}}
	</table>
</div>
