<title>User Raffle ETH Deposits</title>
<div class="page-header">
	<h1>Raffle ETH Deposits</h1>
	<div class="address-display">{{.UserInfo.Address}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Winner</th>
			<th class="center">Round</th>
			<th class="right">Amount</th>
		</tr>
		{{- range $i, $change := .UserRaffleDeposits}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .WinnerAddr}}
				</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="right">{{printf "%.6f" .Amount}} ETH</td>
			</tr>
		{{- end}}
	</table>
</div>
