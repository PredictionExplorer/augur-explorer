<title>NFT Donation Statistics</title>
<div class="page-header">
	<h1>NFT Donation Statistics</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Token Address</th>
			<th class="center">Number of Donated Tokens</th>
		</tr>
		{{- range $i, $change := .NFTDonationStats}}
			<tr>
				<td class="monospace">{{.TokenAddress}}</td>
				<td class="center"><a href="/cosmicsignature/donations/nft/by_token/{{.TokenAddress}}">{{.NumDonations}}</a></td>
			</tr>
		{{- end}}
	</table>
</div>
