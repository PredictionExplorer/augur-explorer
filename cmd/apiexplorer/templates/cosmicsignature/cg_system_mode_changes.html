<title>System Mode Changes</title>
<div class="page-header">
	<h1>Round Configurations</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th>DateTime</th>
			<th class="center">Round</th>
			<th class="center">Events</th>
			<th class="center">Event Low</th>
			<th class="center">Event High</th>
		</tr>
		{{- range $i, $change := .SystemModeChanges}}
			<tr>
				<td class="center">{{arbiscanTx .TxHash .BlockNum}}</td>
				<td>
					{{ if eq -1.0 .EvtLogId }}
						<span class="badge badge-info">Deployment</span>
					{{else}}
						{{.DateTime}}
					{{ end }}
				</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="center">
					<a href="/cosmicsignature/system/admin_events/{{.EvtLogId}}/{{.NextEvtLogId}}">View Events</a>
				</td>
				<td class="center">{{.EvtLogId}}</td>
				<td class="center">{{.NextEvtLogId}}</td>
			</tr>
		{{- end}}
	</table>
</div>
