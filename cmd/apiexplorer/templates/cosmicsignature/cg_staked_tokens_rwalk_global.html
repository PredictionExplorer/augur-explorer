<title>Staked RWalk Tokens Global</title>
<div class="page-header">
	<h1>Globally Staked RandomWalk Tokens</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th class="center">Action ID</th>
			<th>Stake DateTime</th>
			<th class="center">Token ID</th>
			<th>User</th>
		</tr>
		{{- range $i, $change := .StakedTokensRWalk}}
			<tr>
				<td class="center">{{.StakeBlockNum}}</td>
				<td class="center">{{.StakeActionId}}</td>
				<td>{{.StakeDateTime}}</td>
				<td class="center">{{.StakedTokenId}}</td>
				<td class="monospace">
					<a href="/cosmicsignature/staking/randomwalk/staked_tokens/by_user/{{.UserAddr}}">{{.UserAddr}}</a>
				</td>
			</tr>
		{{- end}}
	</table>
</div>
