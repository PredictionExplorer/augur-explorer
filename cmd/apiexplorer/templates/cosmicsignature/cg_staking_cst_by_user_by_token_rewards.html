<title>CST Staking Rewards By Token</title>
<div class="page-header">
	<h1>CST Staking Rewards By Token</h1>
	<div class="address-display">{{.UserAddr}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Token ID</th>
			<th class="right">Reward Collected</th>
			<th class="right">Reward To Collect</th>
		</tr>
		{{- range $i, $change := .RewardsByToken}}
			<tr>
				<td class="center">
					<a href="/cosmicsignature/staking/cst/rewards/by_user/by_token/details/{{$.UserAddr}}/{{.TokenId}}">{{.TokenId}}</a>
				</td>
				<td class="right">{{printf "%.6f" .RewardCollectedEth}} ETH</td>
				<td class="right">{{printf "%.6f" .RewardToCollectEth}} ETH</td>
			</tr>
		{{- end}}
	</table>
</div>
