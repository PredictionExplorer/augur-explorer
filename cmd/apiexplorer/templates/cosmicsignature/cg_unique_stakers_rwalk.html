<title>Unique RandomWalk Stakers</title>
<div class="page-header">
	<h1>Unique RandomWalk Token Stakers</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Staker Address</th>
			<th class="center">Tokens Staked</th>
			<th class="center">Stake Actions</th>
			<th class="center">Token Rewards</th>
		</tr>
		{{- range $i, $change := .UniqueStakersRWalk}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .StakerAddr}}
				</td>
				<td class="center"><a href="/cosmicsignature/staking/randomwalk/staked_tokens/by_user/{{.StakerAddr}}">{{.TotalTokensStaked}}</a></td>
				<td class="center">
					<a href="/cosmicsignature/staking/randomwalk/actions/by_user/{{.StakerAddr}}">{{.NumStakeActions}}</a>
				</td>
				<td class="center"><a href="/cosmicsignature/staking/randomwalk/mints/by_user/{{.StakerAddr}}">{{.TotalTokensMinted}}</a></td>
			</tr>
		{{- end}}
	</table>
</div>
