<html>
<head>
	<link href="/res/main.css" rel="stylesheet">
	<link href="/res/cosmicgame.css" rel="stylesheet">
	<title>Named CosmicSignature Tokens</title>
</head>
<body>
	<div class="cg-container">
		<div class="page-header">
			<a class="home-link" href="/cosmicsignature">&larr; Home</a>
			<h1>Named CosmicSignature Tokens</h1>
		</div>

		<div class="section-card">
			<table class="data-table">
				<tr>
					<th>DateTime Minted</th>
					<th class="center">Token ID</th>
					<th>Token Name</th>
				</tr>
				{{- range $i, $change := .NamedTokens}}
					<tr>
						<td>{{.MintDateTime}}</td>
						<td class="center">{{.TokenId}}</td>
						<td>
							<a href="/cosmicsignature/cst/info/{{.TokenId}}">{{.TokenName}}</a>
						</td>
					</tr>
				{{- end}}
			</table>
		</div>

		<div class="api-info">
			<strong>API Endpoint:</strong><br/>
			<code>/api/cosmicgame/cst/names/named_only</code><br/><br/>
			<strong>Example:</strong><br/>
			<code>/api/cosmicgame/cst/names/named_only</code>
		</div>
	</div>
</body>
</html>
