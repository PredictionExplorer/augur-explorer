<title>Unique Donors</title>
<div class="page-header">
	<h1>Unique Donors</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Donor Address</th>
			<th class="center">Donations Made</th>
			<th class="right">Total ETH Donated</th>
		</tr>
		{{- range $i, $change := .UniqueDonors}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .DonorAddr}}
				</td>
				<td class="center"><a href="/cosmicsignature/donations/eth/by_user/{{.DonorAddr}}">{{.CountDonations}}</a></td>
				<td class="right">{{printf "%.6f" .TotalDonatedEth}}</td>
			</tr>
		{{- end}}
	</table>
</div>
