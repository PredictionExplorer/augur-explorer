<title>Token Name History</title>
<div class="page-header">
	<h1>Token Name History</h1>
	<div class="subtitle">Token ID: {{.TokenId}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th>DateTime</th>
			<th>Token Name</th>
		</tr>
		{{- range $i, $change := .TokenNameHistory}}
			<tr>
				<td class="center">{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td>{{.TokenName}}</td>
			</tr>
		{{- end}}
	</table>
</div>
