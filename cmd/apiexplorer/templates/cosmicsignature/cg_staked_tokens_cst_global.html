<title>Staked CST Tokens Global</title>
<div class="page-header">
	<h1>Globally Staked CST Tokens</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th class="center">Action ID</th>
			<th>Stake DateTime</th>
			<th class="center">Token ID</th>
			<th>User</th>
		</tr>
		{{- range $i, $change := .StakedTokensCST}}
			<tr>
				<td class="center">{{.StakeBlockNum}}</td>
				<td class="center">{{.StakeActionId}}</td>
				<td>{{.StakeDateTime}}</td>
				<td class="center">
					<a href="/cosmicsignature/cst/info/{{.TokenInfo.TokenId}}">{{.TokenInfo.TokenId}}</a>
				</td>
				<td class="monospace">
					{{ethAddrLink .UserAddr}}
				</td>
			</tr>
		{{- end}}
	</table>
</div>
