<title>NFT Donations</title>
<div class="page-header">
	<h1>NFT Donations</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Donor</th>
			<th>Token Address</th>
			<th class="center">Round</th>
			<th class="center">NFT ID</th>
			<th>NFT URI</th>
		</tr>
		{{- range $i, $change := .NFTDonations}}
			<tr>
				<td>
					{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}
				</td>
				<td><a href="/cosmicsignature/donations/nft/info/{{.RecordId}}">{{.Tx.DateTime}}</a></td>
				<td class="monospace">
					{{ethAddrLink .DonorAddr}}
				</td>
				<td class="monospace">{{.TokenAddr}}</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="center">{{.NFTTokenId}}</td>
				<td><span class="trunc" title="{{.NFTTokenURI}}">{{.NFTTokenURI}}</span></td>
			</tr>
		{{- end}}
	</table>
</div>
