<title>Unique Winners</title>
<div class="page-header">
	<h1>Unique Winners</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Winner Address</th>
			<th class="center">Prizes Taken</th>
			<th class="right">Max Prize (ETH)</th>
			<th class="right">Total Won (ETH)</th>
		</tr>
		{{- range $i, $change := .UniqueWinners}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .WinnerAddr}}
				</td>
				<td class="center"><a href="/cosmicsignature/prizes/history/by_user/{{.WinnerAddr}}/0/10000">{{.PrizesCount}}</a></td>
				<td class="right">{{printf "%.6f" .MaxWinAmountEth}}</td>
				<td class="right">{{printf "%.6f" .PrizesSum}}</td>
			</tr>
		{{- end}}
	</table>
</div>
