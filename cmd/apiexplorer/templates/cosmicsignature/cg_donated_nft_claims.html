<title>Donated NFT Claims</title>
<div class="page-header">
	<h1>Claims of Donated NFTs</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Winner</th>
			<th>Donor</th>
			<th class="center">Token ID</th>
		</tr>
		{{- range $i, $change := .DonatedNFTClaims}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .WinnerAddr}}
				</td>
				<td class="monospace">
					{{ethAddrLink .DonorAddr}}
				</td>
				<td class="center">{{.NFTTokenId}}</td>
			</tr>
		{{- end}}
	</table>
</div>
