<title>Token Transfer History</title>
<div class="page-header">
	<h1>Token Transfer History</h1>
	<div class="subtitle">Token ID: {{.TokenId}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th>DateTime</th>
			<th>From</th>
			<th>To</th>
		</tr>
		{{- range $i, $change := .TokenTransfers}}
			<tr>
				<td class="center">{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .FromAddr}}
				</td>
				<td class="monospace">
					{{ethAddrLink .ToAddr}}
				</td>
			</tr>
		{{- end}}
	</table>
</div>
