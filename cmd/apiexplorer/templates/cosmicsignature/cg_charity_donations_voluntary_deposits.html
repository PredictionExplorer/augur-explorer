<title>Voluntary Charity Deposits</title>
<div class="page-header">
	<h1>Voluntary Charity Deposits</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Donor</th>
			<th class="right">Amount (ETH)</th>
		</tr>
		{{- range $i, $change := .CharityDonations}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .DonorAddr}}
				</td>
				<td class="right">{{printf "%.6f" .AmountEth}}</td>
			</tr>
		{{- end}}
	</table>
</div>
