<title>Direct ETH Donations - Round {{.RoundNum}}</title>
<div class="page-header">
	<h1>Direct ETH Donations</h1>
	<div class="subtitle">Round #{{.RoundNum}} (via donate() function)</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th class="center">Round</th>
			<th>Donor</th>
			<th class="right">Amount (ETH)</th>
		</tr>
		{{- range $i, $change := .DirectCGDonations}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="monospace">
					{{ethAddrLink .DonorAddr}}
				</td>
				<td class="right">{{printf "%.6f" .AmountEth}}</td>
			</tr>
		{{- end}}
	</table>
</div>
