<title>Marketing Rewards by User</title>
<div class="page-header">
	<h1>Marketing Rewards</h1>
	<div class="address-display">{{.UserAddr}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th class="right">Amount</th>
		</tr>
		{{- range $i, $change := .UserMarketingRewards}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="right">{{printf "%.6f" .AmountEth}} ETH</td>
			</tr>
		{{- end}}
	</table>
</div>
