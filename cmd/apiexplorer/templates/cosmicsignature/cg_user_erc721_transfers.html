<title>User ERC721 Transfers</title>
<div class="page-header">
	<h1>CosmicSignature (ERC721) Transfers</h1>
	<div class="address-display">{{.UserAddr}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th class="center">Block</th>
			<th>DateTime</th>
			<th>From</th>
			<th>To</th>
			<th class="center">Token ID</th>
		</tr>
		{{- range $i, $change := .CosmicSignatureTransfers}}
			<tr>
				<td class="center">{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .FromAddr}}
				</td>
				<td class="monospace">
					{{ethAddrLink .ToAddr}}
				</td>
				<td class="center">
					<a href="/cosmicsignature/cst/info/{{.TokenId}}">{{.TokenId}}</a>
				</td>
			</tr>
		{{- end}}
	</table>
</div>
