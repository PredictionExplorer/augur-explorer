<title>User NFT Raffle Winnings</title>
<div class="page-header">
	<h1>NFT Raffle Winnings</h1>
	<div class="address-display">{{.UserInfo.Address}}</div>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Winner</th>
			<th class="center">Round</th>
			<th class="center">Index</th>
			<th class="center">Token ID</th>
		</tr>
		{{- range $i, $change := .UserRaffleNFTWinnings}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					{{ethAddrLink .WinnerAddr}}
				</td>
				<td class="center">{{.RoundNum}}</td>
				<td class="center">{{.WinnerIndex}}</td>
				<td class="center">
					<a href="/cosmicsignature/cst/info/{{.TokenId}}">{{.TokenId}}</a>
				</td>
			</tr>
		{{- end}}
	</table>
</div>
