<title>Unique Bidders</title>
<div class="page-header">
	<h1>Unique Bidder Accounts</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Bidder Address</th>
			<th class="center">Num Bids</th>
			<th class="right">Max Bid (ETH)</th>
		</tr>
		{{- range $i, $change := .UniqueBidders}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .BidderAddr}}
				</td>
				<td class="center">{{.NumBids}}</td>
				<td class="right">{{printf "%.6f" .MaxBidAmountEth}}</td>
			</tr>
		{{- end}}
	</table>
</div>
