<title>Marketing Rewards Global</title>
<div class="page-header">
	<h1>Marketing Rewards (Global)</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th>Marketer</th>
			<th class="right">Amount</th>
		</tr>
		{{- range $i, $change := .MarketingRewards}}
			<tr>
				<td>{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}</td>
				<td>{{.Tx.DateTime}}</td>
				<td class="monospace">
					<a href="/cosmicsignature/marketing/rewards/by_user/{{.MarketerAddr}}">{{.MarketerAddr}}</a>
				</td>
				<td class="right">{{printf "%.6f" .AmountEth}} ETH</td>
			</tr>
		{{- end}}
	</table>
</div>
