<title>ERC20 Donations Global</title>
<div class="page-header">
	<h1>ERC20 Donations</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Block</th>
			<th>DateTime</th>
			<th class="center">Round</th>
			<th>Token Address</th>
			<th class="right">Amount</th>
			<th>Winner</th>
		</tr>
		{{- range $i, $change := .DonationsERC20}}
			<tr>
				<td>
					{{arbiscanTx .Tx.TxHash .Tx.BlockNum}}
				</td>
				<td><a href="/cosmicsignature/donations/erc20/info/{{.RecordId}}">{{.Tx.DateTime}}</a></td>
				<td class="center">{{.RoundNum}}</td>
				<td class="monospace">{{.TokenAddr}}</td>
				<td class="right">{{printf "%.6f" .AmountEth}}</td>
				<td class="monospace">
					{{ethAddrLink .WinnerAddr}}
				</td>
			</tr>
		{{- end}}
	</table>
</div>
