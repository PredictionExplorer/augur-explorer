<title>CosmicToken Balances</title>
<div class="page-header">
	<h1>CosmicToken (ERC20) Balances</h1>
</div>

<div class="section-card">
	<table class="data-table">
		<tr>
			<th>Holder Address</th>
			<th class="right">Balance</th>
		</tr>
		{{- range $i, $change := .CosmicTokenBalances}}
			<tr>
				<td class="monospace">
					{{ethAddrLink .OwnerAddr}}
				</td>
				<td class="right">{{printf "%.2f" .BalanceFloat}}</td>
			</tr>
		{{- end}}
	</table>
</div>
