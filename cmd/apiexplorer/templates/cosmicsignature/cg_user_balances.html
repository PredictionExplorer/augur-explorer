<title>User Balances</title>
<div class="page-header">
	<h1>User Balances</h1>
	<div class="address-display">{{.UserAddr}}</div>
</div>

<div class="section-card">
	<div class="stats-dashboard">
		<div class="stat-card">
			<div class="stat-label">ETH Balance</div>
			<div class="stat-value">{{weiToEth .ETH_Balance}}</div>
			<div class="stat-sublabel">ETH</div>
		</div>
		<div class="stat-card">
			<div class="stat-label">CosmicToken Balance</div>
			<div class="stat-value">{{weiToEth .CosmicTokenBalance}}</div>
			<div class="stat-sublabel">CST (ERC20)</div>
		</div>
	</div>
</div>
